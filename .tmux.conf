# OSクリップボードと同期（可能なら）
# set-option -g set-clipboard on
# set -g set-clipboard on
set -g mode-keys vi

# sync clipboard
# set-option -g set-clipboard external

# ローカルでは wl-copy、SSH 越しでは OSC52 でクライアント端末へ送る
# (詳しくは ~/dotfiles/.config/tmux/clipboard.sh のコメント参照)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel '$HOME/dotfiles/.config/tmux/clipboard.sh'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel '$HOME/dotfiles/.config/tmux/clipboard.sh'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# change pain size
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# if local.conf exist, load
if-shell "test -f ~/.tmux/local.conf" "source-file ~/.tmux/local.conf"

# OSC52を使ってクリップボードに送る（必要な場合）
# set-option -g terminal-overrides 'xterm*:clipboard:cc'

set -g default-terminal "tmux-256color"
# source-file を繰り返しても terminal-features の追記が重複しないよう既定値へ戻す
set -gu terminal-features
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# クライアント端末 (kitty / ghostty) への機能転送
# - clipboard: set-clipboard on と合わせ、SSH 先のコピーを OSC52 で端末へ届ける
# - kitty graphics: tmux 自身の terminal feature ではなく、画像を出すアプリが
#   tmux passthrough で転送する (kitten icat / chafa / yazi など)
set -g allow-passthrough on

set-option -g status-right "#[fg=green,bg=default,bright]#(tmux-mem-cpu-load -a 0) "
set-option -g status-style bg=default
set-window-option -g window-status-style bg=default

# Theme options
# set -g @catppuccin_flavor 'macchiato'
#set -g @catppuccin_window_status_style "rounded"
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'dawn' # Options are 'main', 'moon' or 'dawn'

# General settings
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane
set-option -g set-clipboard on
# set-option -ga terminal-overrides ',xterm-256color:clipboard:enable'

set -g @scroll-speed-num-lines-per-scroll 0.5

# Status bar
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-justify left
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g status-position top
