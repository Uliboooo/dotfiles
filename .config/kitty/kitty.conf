font_size 12
modify_font cell_height 100%
modify_font cell_width 100%
enable_audio_bell no

tab_bar_edge top
tab_bar_margin_width 6
tab_bar_margin_height 4.0 4.0
tab_bar_align left
tab_powerline_style round
tab_separator " / "
tab_activity_symbol '!'
tab_bar_style powerline

include themes/rose-pine-moon.conf
# include themes/rose-pine-dawn.conf
# env TERM_BACKGROUND=light

background_opacity 0.8
background_blur 2

scrollbar hovered

# BEGIN_KITTY_FONTS
font_family      family="Monaspace Radon Var"
bold_font        family='Monaspace Radon Var' style=Bold variable_name=MonaspaceRadonVar
italic_font      family='Monaspace Radon Var' style=Italic variable_name=MonaspaceRadonVar
bold_italic_font auto
# END_KITTY_FONTS

symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+31F0-U+31FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+, load_config_file
map ctrl+shift+[ launch --location=hsplit --cwd current
map ctrl+shift+] launch --location=vsplit --cwd current
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

mouse_map ctrl+left click ungrabbed mouse_handle_click link

env TERM_BACKGROUND=dark

notify_on_cmd_finish unfocused 5.0
allow_remote_control yes
enabled_layouts splits
shell_integration enabled
listen_on unix:/tmp/mykitty

clipboard_control write-clipboard write-primary

macos_titlebar_color background

selection_background #DA70D6
selection_foreground #232136
cursor_text_color #232136
