general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# アイドル 30 分で hibernate(S4)。ただし「バッテリー駆動時のみ」。
# before_sleep_cmd がロックも掛ける。
#
# AC 接続(=ドック)時は hibernate しない。理由:
#   - ドック中の hibernate は USB-C/PCIe PME の wake で電源断が巻き戻り、
#     クリーンに戻らず再起動になることがある(実害あり)。
#   - AC 時はたいてい在席・音楽再生中などで、そもそも落としたくない。
# hypridle はキー/マウスの無操作しか見ず音声再生を考慮しないので、AC 判定を
# on-timeout 側のガードで入れる(/sys/class/power_supply/AC/online: 1=AC, 0=電池)。
#
# suspend-then-hibernate は使わない: この機(ThinkPad E14 Gen6 / Modern
# Standby)は wake 可能な RTC が S4 からしか起こせず s2idle から復帰できない
# ため、s2idle→S4 の自動遷移が成立しない。バッテリー時の直接 hibernate なら
# RTC wake 不要で完了する。
listener {
    timeout = 1800
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl hibernate'
}
