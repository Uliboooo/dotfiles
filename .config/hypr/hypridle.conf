general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 以下 2 つのリスナーは niri / Hyprland 共用。DPMS のコマンドだけコンポジタで
# 違うので pidof で振り分ける。$NIRI_SOCKET のような環境変数参照は hyprlang が
# 自前の変数として食ってしまうので使わない($(...) は識別子でないので安全)。
# hypridle.service の PATH には niri も hyprctl も brightnessctl も jq も入らない
# ため /run/current-system/sw/bin を絶対パスで叩く。
#
# 音声再生の判定について。hypridle はコンポジタの ext_idle_notifier_v1 しか見ず、
# キー/マウスの無操作だけで発火する。アイドル抑止(zwp_idle_inhibit_manager_v1、
# niri は実装済み)は ignore_inhibit=false なので尊重されるが、音声のみの再生で
# 抑止を取るアプリはほとんど無い(ブラウザが取るのは動画再生時)。そのため
# PipeWire に再生中ストリームがあるかを自前で見る。ALSA の
# /proc/asound/card*/pcm*p/sub*/status を見る手もあるが Bluetooth 出力は ALSA を
# 通らず検出できないので使わない。pw-dump が落ちた場合は「再生していない」側
# ではなく「ロックする」側に倒れる(fail-safe)。

# 8 分: 減光。-s で現在の輝度を保存し、復帰時に -r で元に戻す。
listener {
    timeout = 480
    on-timeout = /run/current-system/sw/bin/brightnessctl -s set 10%
    on-resume = /run/current-system/sw/bin/brightnessctl -r
}

# 10 分: ロック + 画面オフ(DPMS)。GNOME の idle-delay 600 相当。
# ここが無いと 30 分の hibernate まで画面が点きっぱなしになり、離席のたびに
# パネルが電力を食い続ける(かつロックも掛からない)。
#
# ロックを撃たない条件が 2 つ:
#   - 音声再生中(30 分の hibernate と同じ判定)
#   - AC 接続中。AC = 自宅/ドックで在席中という運用なので、離席時の情報漏洩より
#     復帰のたびの再認証のほうが邪魔になる。バッテリー駆動 = 持ち出し中なので
#     こちらは従来どおりロックする。
# AC 判定は hibernate 側の `= 0` ではなく `!= 1` にしてある。ファイルが読めない
# ときに「ロックする」側へ倒すため(fail-safe の向きが逆)。
#
# 画面オフは AC でも再生中でも常に行う: パネルを消しても再生は続くし、ロック
# しないこととも独立なので省電力上むしろ好都合。
# hypridle はコマンドをシェル経由で実行する(general の lock_cmd が `||` を使えて
# いるのが根拠)ので sh -c で包む必要は無い。包まないほうが jq のフィルタに
# シングルクォートを使えて読みやすい。
listener {
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" != 1 ] && ! /run/current-system/sw/bin/pw-dump | /run/current-system/sw/bin/jq -e 'any(.[]; .info.props."media.class"=="Stream/Output/Audio" and .info.state=="running")' >/dev/null && loginctl lock-session; if pidof niri >/dev/null; then /run/current-system/sw/bin/niri msg action power-off-monitors; else /run/current-system/sw/bin/hyprctl dispatch dpms off; fi
    on-resume = if pidof niri >/dev/null; then /run/current-system/sw/bin/niri msg action power-on-monitors; else /run/current-system/sw/bin/hyprctl dispatch dpms on; fi
}

# アイドル 30 分で hibernate(S4)。ただし「バッテリー駆動時のみ」。
# before_sleep_cmd がロックも掛ける。
#
# AC 接続(=ドック)時は hibernate しない。理由:
#   - ドック中の hibernate は USB-C/PCIe PME の wake で電源断が巻き戻り、
#     クリーンに戻らず再起動になることがある(実害あり)。
#   - AC 時はたいてい在席・音楽再生中などで、そもそも落としたくない。
# AC 判定は on-timeout 側のガードで入れる
# (/sys/class/power_supply/AC/online: 1=AC, 0=電池)。
# 音声再生中も撃たない。ここで落とすと再生が止まって電源まで切れる。
#
# suspend-then-hibernate は使わない: この機(ThinkPad E14 Gen6 / Modern
# Standby)は wake 可能な RTC が S4 からしか起こせず s2idle から復帰できない
# ため、s2idle→S4 の自動遷移が成立しない。バッテリー時の直接 hibernate なら
# RTC wake 不要で完了する。
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && ! /run/current-system/sw/bin/pw-dump | /run/current-system/sw/bin/jq -e 'any(.[]; .info.props."media.class"=="Stream/Output/Audio" and .info.state=="running")' >/dev/null && systemctl hibernate
}
