general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# アイドル 30 分で直接 hibernate(S4)。before_sleep_cmd がロックも掛ける。
#
# suspend-then-hibernate は使わない: この機(ThinkPad E14 Gen6 / Modern
# Standby)は wake 可能な RTC が S4 からしか起こせず s2idle から復帰できない
# ため、s2idle→S4 の自動遷移が成立しないため。直接 hibernate なら RTC wake
# 不要で完了する（アンドック時）。ドック中は USB-C/PCIe PME の wake で電源断
# が巻き戻ることがあるが、画像は書くだけでセッションは保持され無害。
listener {
    timeout = 1800
    on-timeout = systemctl hibernate
}
