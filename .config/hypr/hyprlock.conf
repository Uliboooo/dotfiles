general {
    hide_cursor = true
}

# Neon: 壁紙スクリーンショットを軽く blur して透けさせる + カラー罫線・アクセント。
# color は screenshot が取れないときのフォールバックのみ。
background {
    monitor =
    path = screenshot
    color = rgba(35, 33, 54, 0.6)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = 10
    # 枠は neon-pink の罫、面は module の暗色、文字は fg。
    outer_color = rgb(ea9a97)
    inner_color = rgb(2a273f)
    font_color = rgb(e0def4)
    fade_on_empty = false
    fade_timeout = 1000
    # $FPRINTPROMPT swaps between auth:fingerprint:ready_message and
    # present_message on its own; $FPRINTFAIL is empty unless a scan failed.
    # Both live here rather than in standalone labels, because a label bound to
    # an empty variable still renders a 1px sliver.
    placeholder_text = <i>Input Password...</i>  $FPRINTPROMPT $FPRINTFAIL
    font_family = Monaspace Radon Var
    hide_input = false
    rounding = 10
    # 成功/フォーカスは mauve、失敗と caps lock だけ red。
    check_color = rgb(c4a7e7)
    fail_color = rgb(eb6f92)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(eb6f92)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(c4a7e7)
    font_size = 120
    font_family = Monaspace Radon Var
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(908caa)
    font_size = 24
    font_family = Monaspace Radon Var
    position = 0, 50
    halign = center
    valign = center
}

# Fingerprint status line. $FPRINTPROMPT renders auth:fingerprint:ready_message
# while idle and present_message while scanning; $FPRINTFAIL is empty unless a
# scan failed, so the second label stays invisible until it has something to say.
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(908caa)
    font_size = 18
    font_family = Monaspace Radon Var
    position = 0, -70
    halign = center
    valign = center
}

auth {
    # hyprlock talks to fprintd over DBus itself, so this does NOT need
    # pam_fprintd / security.pam.services.hyprlock.fprintAuth.
    fingerprint:enabled = true
    fingerprint:ready_message = <span foreground="##ea9a97">(scan fingerprint)</span>
    fingerprint:present_message = <span foreground="##908caa">authenticating...</span>
    fingerprint:retry_delay = 250

    pam:enabled = true
    pam:module = hyprlock
}

