# ziggity config
# !!! ziggity(ziggity 0.14.0-dev) don't support XDG PATH.
# -> need to set `ZIGGITY_CONFIG` in shell

show_file_tree = true

#  ╔═╗ ╔═╗ ╦   ╔═╗ ╦═╗
#  ║   ║ ║ ║   ║ ║ ╠╦╝
#  ╚═╝ ╚═╝ ╩═╝ ╚═╝ ╩╚═
# Uncoated Paper Design (README/PaperDesign.md) を 256 色パレットに落としたもの。
# ziggity の色は端末パレットの index (0-255) しか取れないので、テーマ非依存の
# 16-255 (カラーキューブ/グレースケール) から paper palette に最も近い index を使う。
#
#   paper       #f1eee5 -> 230   ink        #2d302b -> 236
#   paper-light #fbf9f2 -> 255   ink-muted  #77766d -> 243
#   rule        #b7b0a2 -> 145   rule-soft  #d0c9bb -> 187
#   rose        #d38ca0 -> 175   rose-wash  #ead2d9 -> 224
#   warning     #a84435 -> 131
#
# 前提: ghostty は現状 rose-pine-moon の暗い地なので、紙色 (230/187) は「文字」、
# 濃い色は「面」として使う。ghostty を明るい紙テーマに変えた場合は末尾のメモ参照。

# --- 選択行: rose を落とした面に paper の文字 -------------------------------
color.selected_bg = 132           # rose を沈めた面 (#af5f87)
color.inactive_selected_bg = 238  # 非フォーカス側の選択行は罫線程度まで落とす
color.selected_fg = 230           # paper: 選択面の上で読める文字色

# --- 基本の面と罫線 ---------------------------------------------------------
color.active = 175                # rose: focus / active はすべてこの色に寄せる
color.accent = 175                # rose (既定の cyan は使わない)
color.inactive_border = 244       # 薄い罫線。透明にせず紙の上の細線として残す
color.muted = 243                 # ink-muted: 補助テキスト
color.title = 230                 # paper: パネル見出し
color.header = 187                # rule-soft: diff のファイル見出し
color.hunk = 145                  # rule: hunk 見出しは罫線として扱う

# --- diff / status ----------------------------------------------------------
# 加減算は色数を増やさず、彩度を落とした sage と brick の 2 色だけで示す。
color.added = 108                 # sage (#87af87)
color.staged = 108
color.removed = 167               # brick を明度上げたもの (#d75f5f)
color.unstaged = 167
# 語単位ハイライトの面。ここは文字色 (added/removed) がそのまま乗るので、
# 面は文字より十分暗くする。sage/brick と同じ明度帯にすると緑地に緑文字で潰れる。
color.word_add_bg = 22            # 深い緑地 (#005f00) に sage の文字
color.word_del_bg = 52            # 深い臙脂地 (#5f0000) に brick の文字

# --- warning ----------------------------------------------------------------
# PaperDesign の warning #a84435 相当。本当に警告の時だけ出る色なので、
# diff の削除色 (167) より暗く落として区別する。
color.warning = 131

# --- ラベル / フッタ --------------------------------------------------------
color.hash = 187                  # rule-soft: 短縮ハッシュは押印のような控えめな色
color.tag = 224                   # rose-wash: tag の注釈・subject
color.footer = 243                # ink-muted: キー説明
color.footer_key = 175            # rose: キー本体だけ立てる

# ghostty を紙 (明るい地) のテーマに切り替えたら、面と文字を入れ替える:
#   color.selected_bg = 224       # rose-wash
#   color.selected_fg = 236       # ink
#   color.title = 236             # ink
#   color.header = 243            # ink-muted
#   color.hash = 243
