[bar]
order = [ "main" ]

    [bar.main]
    auto_hide = false
    background_opacity = 1.0
    border = "outline"
    border_width = 1.0
    capsule = false
    capsule_radius = 0
    center = [ "active_window", "media", "clock" ]
    color = "on_surface_variant"
    concave_edge_corners = false
    contact_shadow = false
    enabled = true
    end = [ "cpu", "battery", "volume", "tray", "control-center", "notifications" ]
    font_weight = 600
    hover_highlight = false
    margin_edge = 0
    margin_ends = 100
    padding = 12
    position = "top"
    radius = 0
    reserve_space = false
    shadow = false
    show_on_workspace_switch = true
    smart_auto_hide = true
    start = [ "launcher", "workspaces" ]
    thickness = 48
    widget_spacing = 10

[desktop_widgets]
enabled = false

[dock]
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0
border = true

    [osd.kinds]
    keyboard_layout = false

[shell]
avatar_path = "/home/seli/Pictures/wallpapers_insecure/rika.jpg"
button_borders = true
card_borders = true
corner_radius_scale = 0
font_family = "Monaspace Radon Var"
input_borders = true
popup_borders = true
popup_shadows = false
setup_wizard_enabled = false
telemetry_enabled = false

    [shell.animation]
    enabled = false

    [shell.panel]
    borders = true
    control_center_placement = "floating"
    control_center_position = "top_right"
    floating_offset = 8
    list_item_background = false
    shadow = false
    transparency_mode = "solid"

[theme]
custom_palette = "Paper"
mode = "light"
source = "custom"

    [theme.templates]
    builtin_ids = [ "btop", "gtk4", "niri" ]
    enable_builtin_templates = false

[wallpaper]
enabled = false

[widget.active_window]
type = "active_window"

[widget.battery]
type = "battery"

[widget.clock]
color = "on_surface"
font_family = "Monaspace Radon"
font_weight = 700
format = "{:%a %b %-d %-H:%M}"
type = "clock"

[widget.control-center]
type = "control-center"

[widget.cpu]
type = "sysmon"

[widget.launcher]
type = "launcher"

[widget.media]
type = "media"

[widget.notifications]
type = "notifications"

[widget.tray]
type = "tray"

[widget.volume]
type = "volume"

[widget.workspaces]
type = "workspaces"
